name: Key System Server

on:
  push:
    branches: [main, master]
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

concurrency:
  group: key-system
  cancel-in-progress: false

permissions:
  contents: read
  actions: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm install

      - uses: actions/cache/restore@v4
        with:
          path: data
          key: key-system-state-restore
          restore-keys: key-system-state-

      - name: Start Server and Tunnel
        env:
          MAX_RUNTIME_MIN: "340"
          PORT: 3000
        run: |
          # 1. Start the Node.js server in the background
          node server.js &
          
          # 2. Download Cloudflare Tunnel client
          wget -q https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 -O cloudflared
          chmod +x cloudflared
          
          # 3. Start the tunnel to expose port 3000
          ./cloudflared tunnel --url http://localhost:3000 > tunnel.log 2>&1 &
          
          # 4. Wait for the URL and print it
          echo "Waiting for Cloudflare to assign a public URL..."
          URL=""
          for i in {1..30}; do
            URL=$(grep -o 'https://.*\.trycloudflare\.com' tunnel.log | head -n 1)
            if [ -n "$URL" ]; then break; fi
            sleep 1
          done
          
          if [ -z "$URL" ]; then
            echo "❌ Failed to get public URL. Tunnel log:"
            cat tunnel.log
            exit 1
          fi
          
          echo "======================================================"
          echo "🌐 YOUR LIVE WEBSITE URL IS: $URL"
          echo "======================================================"
          echo "⚠️ WARNING: This URL will change when the workflow restarts (every 6 hours)."
          
          # 5. Keep the job alive
          sleep 340m

      - uses: actions/cache/save@v4
        if: always()
        with:
          path: data
          key: key-system-state-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Start next run
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run deploy.yml --ref "${{ github.ref_name }}"
