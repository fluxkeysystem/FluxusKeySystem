name: Key System Server

on:
  push:
    branches: [main, master]
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

concurrency:
  group: key-system
  cancel-in-progress: false

permissions:
  contents: read
  actions: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm install

      - uses: actions/cache/restore@v4
        with:
          path: data
          key: key-system-state-restore
          restore-keys: key-system-state-

      - name: Run Key Server
        env:
          MAX_RUNTIME_MIN: "340"
          PORT: 3000
        run: node server.js

      - uses: actions/cache/save@v4
        if: always()
        with:
          path: data
          key: key-system-state-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Start next run
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run deploy.yml --ref "${{ github.ref_name }}"
